name: Contract validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r protocol/requirements.txt
      - run: python tools/validate_contract.py
      - run: python tools/summon_device_ref.py --selftest
      - run: git diff --check
