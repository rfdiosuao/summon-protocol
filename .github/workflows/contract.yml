name: Contract validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r protocol/requirements.txt
      - run: python tools/validate_contract.py
      - run: python tools/summon_device_ref.py --selftest
      - run: python -m pip install -r hub/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_device_skill.py
      - run: git diff --exit-code -- web/skill.md web/summon-device-onboarding.zip web/summon-device-onboarding.zip.sha256
      - run: git diff --check
