server {
    listen 80;
    server_name summon.entermodetwo.com;
    location /.well-known/acme-challenge/ { root /var/www/summon-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name summon.entermodetwo.com;
    ssl_certificate /etc/letsencrypt/live/summon.entermodetwo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/summon.entermodetwo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    access_log /var/log/nginx/summon-access.log;
    error_log /var/log/nginx/summon-error.log;
    location / {
        proxy_pass http://127.0.0.1:8840;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
