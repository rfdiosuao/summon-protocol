server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    access_log /var/log/nginx/default-proxy.access.log combined;
    error_log /var/log/nginx/default-proxy.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass https://127.0.0.1:443;
        proxy_ssl_server_name on;
        proxy_ssl_name entermodetwo.com;
        proxy_http_version 1.1;
        proxy_set_header Host entermodetwo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_redirect https://entermodetwo.com/ /;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Direct-IP Passport clients explicitly validate this certificate against
    # summon.entermodetwo.com. SNI-based websites keep their own certificates.
    ssl_certificate /etc/letsencrypt/live/summon.entermodetwo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/summon.entermodetwo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/default-proxy.access.log combined;
    error_log /var/log/nginx/default-proxy.error.log warn;

    location = /v1/passport/connect {
        proxy_pass http://127.0.0.1:8842;
        proxy_http_version 1.1;
        proxy_set_header Host summon.entermodetwo.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass https://127.0.0.1:443;
        proxy_ssl_server_name on;
        proxy_ssl_name entermodetwo.com;
        proxy_http_version 1.1;
        proxy_set_header Host entermodetwo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_redirect https://entermodetwo.com/ /;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
