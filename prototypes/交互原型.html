<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>义体 SHELL · 交互原型</title>
<style>
:root{
  --bg:#0b0d14;--bg2:#12151f;--bg3:#181c29;--line:#252a3a;
  --amber:#e8a33d;--amber-dim:#8a6224;
  --teal:#4fd1c5;--teal-dim:#1f6b64;
  --dead:#3c414f;
  --txt:#e8e6e1;--txt2:#9aa0ae;--txt3:#6b7180;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-size:15px;line-height:1.7;min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:ui-monospace,"SF Mono",Consolas,monospace}

#glow{position:fixed;width:340px;height:340px;border-radius:50%;left:0;top:0;z-index:0;
  pointer-events:none;opacity:0;filter:blur(46px);
  background:radial-gradient(circle at center,rgba(232,163,61,.30) 0%,rgba(190,130,45,.12) 38%,transparent 78%);
  transition:opacity .8s ease,background .8s ease}
@media(max-width:760px){#glow{display:none}}

.shell{max-width:1000px;margin:0 auto;padding:0 26px 90px;position:relative;z-index:2}

.bar{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.2em;color:var(--txt3)}
.bar .lv{color:var(--teal)}

.head{padding:56px 0 40px;text-align:center}
.head .kicker{font-size:11px;letter-spacing:.3em;color:var(--txt3);margin-bottom:20px}
.head h1{font-size:40px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin-bottom:12px}
.head h1 em{font-style:normal;color:var(--amber)}
.head .sub{font-size:12.5px;color:var(--txt3);font-style:italic;letter-spacing:.06em}

/* ---------- STAGE ---------- */
.stage{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:center;margin-top:14px}
.stagewrap{position:relative;background:linear-gradient(180deg,transparent,#0e1119 78%);
  border:1px solid var(--line);border-radius:16px;padding:10px 0 0;overflow:hidden}
.stagewrap .floor{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
#arm{display:block;width:100%;height:auto}

.armbody{fill:#2a2f3d;stroke:#454b5c;stroke-width:1.4}
.armbody.acc{fill:#3a4152}
.jointc{fill:#5a6172}
.headdot{fill:var(--dead);transition:fill .8s ease}
.headglow{fill:var(--amber);opacity:0;transition:opacity .8s ease}
.eye{fill:#141822}

.shoulder,.forearm{transition:transform 1.05s cubic-bezier(.34,.9,.3,1)}
.shoulder .armbody,.forearm .armbody{transition:fill .8s ease,stroke .8s ease}

/* IDLE pose */
.pose-idle .shoulder{transform:rotate(80deg)}
.pose-idle .forearm{transform:rotate(80deg)}
/* ACTIVE pose */
.pose-active .shoulder{transform:rotate(10deg)}
.pose-active .forearm{transform:rotate(15deg)}
.pose-active .armbody{fill:#3d3423;stroke:var(--amber-dim)}
.pose-active .headdot{fill:var(--amber)}
.pose-active .headglow{opacity:.85}

/* ---------- SCREEN ---------- */
.screen{background:#0d1018;border:1px solid var(--line);border-radius:14px;padding:22px;
  font-family:ui-monospace,Consolas,monospace;min-height:300px;display:flex;flex-direction:column}
.screen .sh{font-size:10.5px;letter-spacing:.2em;color:var(--txt3);margin-bottom:18px;display:flex;justify-content:space-between}
.screen .big{font-size:26px;font-weight:600;line-height:1.35;margin-bottom:8px;color:var(--txt)}
.screen .sm{font-size:12.5px;color:var(--txt2);line-height:1.7}
.screen .stateline{font-size:12px;color:var(--dead);transition:color .5s ease}
.pose-active .screen .stateline{}
.screen.live .stateline{color:var(--amber)}
.screen.live .big{color:var(--amber)}
.screen.remember .big{color:var(--teal)}
.screen.remember .stateline{color:var(--teal)}
.log{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:11px;line-height:2;color:var(--txt3)}
.log div{opacity:0;transition:opacity .35s ease}
.log div.on{opacity:1}
.log .t{color:#3f4553;margin-right:9px}

/* ---------- ROSTER ---------- */
.roster{border-top:1px solid var(--line);margin-top:44px;padding-top:26px}
.roster .rh{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.2em;color:var(--txt3);margin-bottom:16px}
.ghosts{display:flex;gap:9px;flex-wrap:wrap}
.g{width:88px;padding:12px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);transition:all .5s ease}
.g .gn{font-size:10px;color:var(--txt3);font-family:ui-monospace,Consolas,monospace;margin-bottom:7px}
.g .gt{font-size:11.5px;color:var(--txt2);line-height:1.4}
.g.new{border-color:var(--amber-dim);background:linear-gradient(180deg,rgba(232,163,61,.10),var(--bg2));animation:pop .55s cubic-bezier(.34,.9,.3,1) both}
.g.new .gn{color:var(--amber)} .g.new .gt{color:var(--txt)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}

/* ---------- CTA ---------- */
.cta{dmargin-top:30px;text-align:center}
.btn{display:inline-block;padding:15px 42px;border:1px solid var(--amber-dim);border-radius:10px;
  background:rgba(232,163,61,.07);color:var(--amber);font-size:15.5px;font-weight:500;cursor:pointer;
  transition:background .2s ease,transform .15s ease;font-family:inherit}
.btn:hover{background:rgba(232,163,61,.15)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{border-color:var(--teal-dim);background:rgba(79,209,197,.06);color:var(--teal)}
.btn.ghost:hover{background:rgba(79,209,197,.13)}
.tip{font-size:12.5px;color:var(--txt3);margin-top:15px;text-align:center}

.ticket{margin-top:26px;padding:26px;border:1px solid var(--amber-dim);border-radius:13px;
  background:linear-gradient(180deg,rgba(232,163,61,.07),transparent);text-align:center;display:none}
.ticket.on{display:block;animation:pop .6s cubic-bezier(.34,.9,.3,1) both}
.ticket .th{font-size:10.5px;letter-spacing:.26em;color:var(--amber);margin-bottom:15px}
.ticket .tq{font-size:19px;line-height:1.6;color:var(--txt);margin-bottom:9px}
.ticket .tn{font-size:12px;color:var(--txt3);font-style:italic}

@media(max-width:820px){
  .stage{grid-template-columns:1fr}
  .head h1{font-size:27px}
  .shell{padding:0 17px 70px}
}
</style>
</head>
<body>
<div id="glow" aria-hidden="true"></div>
<div class="shell">

  <div class="bar">
    <span>EVOTAVERN · CYBERBODY</span>
    <span class="lv">SHELL · v0.1</span>
  </div>

  <div class="head">
    <div class="kicker">赛道一 · 具身与穿戴硬件</div>
    <h1>它没有灵魂。<br>直到你<em>住进来</em>。</h1>
    <div class="sub">A SHELL WITH NO GHOST. UNTIL YOU.</div>
  </div>

  <div class="stage pose-idle" id="stage">

    <div class="stagewrap">
      <svg id="arm" viewBox="0 0 420 340" role="img" aria-label="一具低垂着头的机械义体">
        <title>义体：一具没有 Ghost 的义体</title>
        <desc>机械臂处于未激活姿态，低垂着头。当有人入住后，它会抬起头并亮起。</desc>
        <defs>
          <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e8a33d" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#e8a33d" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <ellipse cx="180" cy="316" rx="118" ry="15" fill="#05070c" opacity="0.85"/>
        <ellipse id="haloE" cx="180" cy="300" rx="130" ry="34" fill="url(#halo)" opacity="0"/>

        <g class="shoulder" style="transform-box:view-box;transform-origin:180px 250px">
          <rect class="armbody" x="169" y="150" width="22" height="104" rx="11"/>
          <circle class="jointc" cx="180" cy="150" r="13"/>
          <g class="forearm" style="transform-box:view-box;transform-origin:180px 150px">
            <rect class="armbody acc" x="170" y="58" width="20" height="96" rx="10"/>
            <circle class="jointc" cx="180" cy="58" r="11"/>
            <circle class="headglow" cx="180" cy="44" r="30" opacity="0"/>
            <circle class="headdot" cx="180" cy="40" r="15"/>
            <circle class="eye" cx="180" cy="40" r="6"/>
          </g>
        </g>

        <rect class="armbody acc" x="146" y="244" width="68" height="24" rx="9"/>
        <path class="armbody" d="M118 302 L242 302 L226 266 L134 266 Z"/>
      </svg>
      <div class="floor"></div>
    </div>

    <div class="screen" id="screen">
      <div class="sh"><span>SHELL STATUS</span><span id="scount">ROSTER 0</span></div>
      <div class="big" id="big">空位 · 缺 1 名成员</div>
      <div class="sm" id="sm">这具壳里没有 Ghost。<br>它在等一个愿意住进来的人。</div>
      <div class="log" id="log"></div>
    </div>

  </div>

  <div class="cta">
    <button class="btn" id="enter">住进来 · 40 秒</button>
    <div class="tip" id="tip">点一下，看它抬起头</div>
  </div>

  <div class="roster">
    <div class="rh"><span>住过这具壳的 GHOST</span><span id="rnum">0 位</span></div>
    <div class="ghosts" id="ghosts"></div>
  </div>

  <div class="ticket" id="ticket">
    <div class="th">入住凭证 · 已写入 EvoMap</div>
    <div class="tq">「这具义体不会记得所有人。<br>但它记得我。」</div>
    <div class="tn" id="tnote">凭证 #001 · 可发布到小红书【小工具】</div>
  </div>

</div>

<script>
(function(){
  var stage=document.getElementById('stage'),
      screen=document.getElementById('screen'),
      big=document.getElementById('big'),
      sm=document.getElementById('sm'),
      log=document.getElementById('log'),
      ghosts=document.getElementById('ghosts'),
      rnum=document.getElementById('rnum'),
      scount=document.getElementById('scount'),
      ticket=document.getElementById('ticket'),
      tnote=document.getElementById('tnote'),
      enter=document.getElementById('enter'),
      tip=document.getElementById('tip'),
      haloE=document.getElementById('haloE'),
      glow=document.getElementById('glow');

  /* 鼠标跟随暖光（改自 PrizeOps HERO_FLUID_MOTION 配方 B） */
  window.addEventListener('mousemove',function(e){
    glow.style.opacity='1';
    glow.style.transform='translate3d('+(e.clientX-170)+'px,'+(e.clientY-170)+'px,0)';
  },{passive:true});
  window.addEventListener('mouseleave',function(){glow.style.opacity='0';},{passive:true});

  var ROSTER=[
    {n:'#001',t:'写下一笔「启」'},
    {n:'#002',t:'让它抬手挥手'},
    {n:'#003',t:'教它一个手势'},
    {n:'#004',t:'留下一句暗号'}
  ];
  var idx=4, visits=0, busy=false;

  function push(lvl,msg){
    var d=document.createElement('div');
    d.innerHTML='<span class="t">'+new Date().toTimeString().slice(0,8)+'</span>'+msg;
    log.appendChild(d);
    requestAnimationFrame(function(){d.classList.add('on');});
  }

  function addGhost(n,t,c){
    var g=document.createElement('div');
    g.className='g new';
    g.innerHTML='<div class="gn">'+n+'</div><div class="gt">'+t+'</div>';
    ghosts.appendChild(g);
    if(c) rnum.textContent=c+' 位';
  }

  function enterShell(){
    if(busy) return;
    busy=true; enter.disabled=true;
    visits++;

    if(visits===1){
      /* ---------- 首次入住 ---------- */
      screen.classList.remove('remember'); screen.classList.add('live');
      big.textContent='检测到 Ghost …';
      sm.innerHTML='远场麦阵拾音中。<br>正在读取你的身份。';
      push('SCAN','远场麦阵锁定声源 · 距离 2.4m');

      setTimeout(function(){
        big.textContent='入住中 · 正在同步';
        sm.innerHTML='你的 Ghost 正在进入这具 Shell。';
        push('LINK','EvoX Agent 已在壳内启动');
      },700);

      setTimeout(function(){
        stage.classList.remove('pose-idle');
        stage.classList.add('pose-active');
        haloE.setAttribute('opacity','0.5');
        big.textContent='它抬头了。';
        sm.innerHTML='这具壳现在有 Ghost 了。<br>——是你。';
        push('WAKE','姿态已激活 · 义体有了灵魂');
        tip.textContent='你看，它动了。';
      },1500);

      setTimeout(function(){
        big.textContent='正在为你完成一件事';
        sm.innerHTML='它去 EvoMap 查了前人留下的经验，<br>然后决定替你写一笔。';
        push('EVOMAP','检索到 4 条已验证经验 · 继承第 #002 条');
      },3000);

      setTimeout(function(){
        idx++;
        var id='#'+String(idx).padStart(3,'0');
        addGhost(id,'写下一笔「住」',visits);
        big.textContent='完成了。';
        sm.innerHTML='它替你写的那一笔，<br>现在留在壳上了。';
        push('DELIVER','交付完成 · 用时 38 秒');
        scount.textContent='ROSTER '+visits;
      },4600);

      setTimeout(function(){
        screen.classList.remove('live');
        big.textContent='义体记得你。';
        sm.innerHTML='本次入住已结构化写入 <b style="color:#4fd1c5">EvoMap</b>。<br>下一次你走近，它会认出你。';
        push('AGED','经验已写入 EvoMap · 供后来者继承');
        ticket.querySelector('.tn').textContent='凭证 '+('#00'+idx)+' · 可发布到小红书【小工具】';
        ticket.classList.add('on');
        tip.textContent='走出摊位，再走回来试试。';
        enter.textContent='再次走近这具义体';
        enter.classList.remove('btn'); enter.classList.add('btn','ghost');
        enter.disabled=false; busy=false;
      },5800);

    } else {
      /* ---------- 再次路过：它记得你 ---------- */
      screen.classList.remove('live'); screen.classList.add('remember');
      big.textContent='欢迎回来。';
      sm.innerHTML='你上次让它写的那一笔，<br>现在正在教第 '+visits+' 个人。';
      push('RECALL','身份匹配 · 与 #00'+(idx)+' 一致');
      setTimeout(function(){
        push('MEMORY','你在 EvoMap 里的经验已被 '+(visits+2)+' 次继承');
        tip.textContent='这就是「它记得你」。';
        enter.disabled=false; busy=false;
      },800);
    }
  }

  enter.addEventListener('click',enterShell);
})();
</script>
</body>
</html>
